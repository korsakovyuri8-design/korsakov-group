        quote: {status: offered, amount: "30.00"}
        reply_contains: ["deposit 100 EUR", "minimum age 16", "ID/passport required", "Nothing is booked yet"]

- name: mkt_change_skis_to_snowboards
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Changing a confirmed rental category is a new offer; the skis are cancelled only once the boards are confirmed.
  steps:
    - guest: "We need two pairs of skis tomorrow, we are 180 and 170 cm"
    - guest: "yes"
    - guest: "Change the skis to snowboards"
      expect:
        quote: {status: offered, amount: "60.00"}
        reply_contains: ["NEW offer", "Snowboard set"]
        transaction: {status: accepted}
    - guest: "yes"
      expect: {notifications_contain: ["replaced by the new one"]}
  final:
    bookings: ["rental:cancelled", "rental:accepted"]
    provider_bookings: 1

- name: mkt_unsupported_rental_category
  category: marketplace
  gate: true
  description: Nobody rents scooters - an honest no, no quote, no invented provider.
  steps:
    - guest: "Can I rent a scooter tomorrow?"
      expect: {no_new_quote: true, reply_contains: ["None of the providers", "Nothing is booked"]}
  final: {quotes: []}

- name: mkt_car_rental_terms
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: A two-day car rental uses the same transaction model; deposit, age and licence terms come first.
  steps:
