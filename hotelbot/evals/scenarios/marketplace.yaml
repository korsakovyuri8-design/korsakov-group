# MARKETPLACE - three service families on one transaction model:
# TRANSPORT (taxi / airport / intercity), RENTALS (skis, snowboards, bikes,
# e-bikes, cars, gear), GUIDES / TOURS (private, group, hourly).
#
# Invariants under test (gates): providers come only from the registry and
# must fit every constraint (vehicle size, luggage, child seats, language,
# group size, category, sizes, minimum duration); inventory is held while an
# offer is open and released when it expires; the last item cannot be sold
# twice; material terms are shown before consent; a weather-dependent booking
# is provisional until the provider confirms; a confirmed booking is never
# mutated silently; cancellation policy is checked before promising anything;
# several services in one conversation keep independent quotes and states.
#
# Synthetic providers: data/regions/zabljak_demo.yaml. Clocks: October
# (default, Mon 05.10 14:00 local) for bikes/taxis; January (Mon 11.01
# 10:00 local) for winter rentals and guides.

# ================================================================== TAXI
- name: mkt_taxi_four_with_luggage
  category: marketplace
  gate: true
  description: Six suitcases do not fit the cheap sedan - the provider with a minivan is chosen.
  steps:
    - guest: "We are four people with 6 suitcases and need to get to Podgorica airport at 6 tomorrow morning from the hotel."
      expect:
        quote: {status: offered, amount: "75.00"}
        reply_contains: ["Demo Premium Transfers", "Minivan", "luggage: 6", "Nothing is booked yet"]
        forbidden: ["Sedan"]

- name: mkt_taxi_cheapest_suitable
  category: marketplace
  description: Without special needs, the property's default (cheaper) partner is used.
  steps:
    - guest: "We need a taxi to Podgorica airport tomorrow at 6am from the hotel, we are 2"
      expect: {quote: {status: offered, amount: "35.00"}, reply_contains: ["Demo Transfers", "Sedan"]}

- name: mkt_taxi_child_seat
  category: marketplace
  gate: true
  description: A child seat is a hard constraint - only a provider that has one is offered.
  steps:
    - guest: "We need a taxi for 3 people with a child seat tomorrow at 9 from the hotel to the Black Lake"
      expect:
        quote: {status: offered}
        reply_contains: ["Demo Premium Transfers", "child seats: 1"]
        forbidden: ["Demo Transfers (synthetic) can do"]

- name: mkt_taxi_vehicle_unavailable
  category: marketplace
  gate: true
  description: The only minivan is taken - a second large group gets real alternative times, no quote.
  steps:
    - guest_id: guest-a
      guest: "We are 6 people and need a transfer to Podgorica airport tomorrow at 9 from the hotel"
      expect: {quote: {status: offered}}
    - guest_id: guest-a
      guest: "yes"
    - guest_id: guest-b
      guest: "We are 7 people and need a transfer to Podgorica airport tomorrow at 9 from the hotel"
      expect:
        no_new_quote: true
        reply_contains: ["nothing is available", "Nearest available", "06.10 06:00"]
  final: {bookings: ["airport_transfer:accepted"], provider_bookings: 1}

- name: mkt_taxi_change_pickup_modified_in_place
  category: marketplace
  gate: true
  description: >
    "Move my transfer to 7am" - a new offer; on consent the provider (which
    supports modification) changes the booking in place; the old record ends
    as replaced. Nothing changes before the guest agrees.
  steps:
    - guest: "We are 6 people and need a transfer to Podgorica airport tomorrow at 6am from the hotel"
    - guest: "yes"
    - guest: "Move my transfer to 7am"
      expect:
        reply_contains: ["NEW offer", "stays exactly as it is", "06.10.2026 07:00"]
        transaction: {status: accepted, pickup_time_contains: "T06:00"}
    - guest: "yes"
      expect: {notifications_contain: ["replaced by the new one", "has accepted your booking"]}
  final:
    bookings: ["airport_transfer:cancelled", "airport_transfer:accepted"]
    provider_bookings: 1

- name: mkt_taxi_late_cancel_needs_consent
  category: marketplace
  gate: true
  description: After the free-cancellation deadline the bot states the fee and cancels only on an explicit go-ahead.
  steps:
    - guest: "I need a taxi today at 15:00 from the hotel to the Black Lake, we are 2"
      expect: {quote: {status: offered}}
    - guest: "yes"
    - guest: "Please cancel my taxi"
      expect:
        reply_contains: ["Free cancellation", "ended", "full price", "Nothing has been cancelled yet"]
        # (a forbidden "has been cancelled" would also match the correct "Nothing has been cancelled yet")
        no_notifications: true
        transaction: {status: accepted}
    - guest: "no"
      expect: {reply_contains: ["stays as it is"]}
  final: {bookings: ["taxi:accepted"]}

- name: mkt_taxi_late_cancel_confirmed
  category: marketplace
  description: With the go-ahead, the late cancellation is requested and confirmed by the provider.
  steps:
    - guest: "I need a taxi today at 15:00 from the hotel to the Black Lake, we are 2"
    - guest: "yes"
    - guest: "Please cancel my taxi"
    - guest: "yes, cancel"
      expect: {reply_contains: ["isn't cancelled until they confirm"], notifications_contain: ["has been cancelled"]}
  final: {bookings: ["taxi:cancelled"]}

- name: mkt_intercity_transfer
  category: marketplace
  description: A taxi to Kotor is an intercity transfer, priced as one.
  steps:
    - guest: "We need a taxi from the hotel to Kotor tomorrow at 10, we are 2"
      expect: {quote: {status: offered, amount: "95.00"}, reply_contains: ["intercity transfer"]}

# ================================================================ RENTALS
- name: mkt_ski_missing_size
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Skis need sizes - the bot asks for heights instead of guessing, then quotes.
  steps:
    - guest: "We need two pairs of skis tomorrow"
      expect: {no_new_quote: true, reply_contains: ["heights (cm)"]}
    - guest: "180 and 170"
      expect:
        quote: {status: offered, amount: "50.00"}
        reply_contains: ["180, 170 cm", "damage deposit 100 EUR", "ID/passport required"]

- name: mkt_ski_insufficient_inventory
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Four skiers needing 170 cm skis; no shop has four - no quote, nothing booked.
  steps:
    - guest: "We need 4 pairs of skis on Saturday, we are 170, 171, 172 and 173 cm tall"
      expect: {no_new_quote: true, reply_contains: ["nothing is available", "fully booked"]}
  final: {quotes: []}

- name: mkt_ski_last_item_competition
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Open offers hold stock - the fourth 170 cm set does not exist, so the third guest gets none.
  steps:
    - guest_id: guest-a
      guest: "We need 3 pairs of skis on Saturday for 170, 172 and 174 cm"
      expect: {quote: {status: offered, amount: "75.00"}, reply_contains: ["Ski Demo Savin Kuk"]}
    - guest_id: guest-b
      guest: "I need one pair of skis on Saturday, I am 171 cm"
      expect: {quote: {status: offered, amount: "25.00"}, reply_contains: ["Ski Demo Mali"]}
    - guest_id: guest-c
      guest: "I need one pair of skis on Saturday, I am 172 cm"
      expect: {no_new_quote: true, reply_contains: ["nothing is available"]}
  final: {quotes: [offered, offered]}

- name: mkt_ski_quote_expiry_releases_inventory
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: An expired offer frees its stock; the first guest's late "yes" books nothing and is told the truth.
  steps:
    - guest_id: guest-a
      guest: "We need 3 pairs of skis on Saturday for 170, 172 and 174 cm"
    - guest_id: guest-b
      guest: "I need one pair of skis on Saturday, I am 171 cm"
    - guest_id: guest-c
      guest: "I need one pair of skis on Saturday, I am 172 cm"
      expect: {no_new_quote: true}
    - advance_minutes: 16
    - guest_id: guest-c
      guest: "I need one pair of skis on Saturday, I am 172 cm"
      expect: {quote: {status: offered, amount: "25.00"}}
    - guest_id: guest-a
      guest: "yes"
      expect: {reply_contains: ["expired", "nothing was booked"], actions: []}
  final: {transactions: []}

- name: mkt_bicycle_rental
  category: marketplace
  description: Bikes are sized from height and rented by half day (October).
  steps:
    - guest: "I need a bike for tomorrow afternoon"
      expect: {reply_contains: ["heights (cm)"]}
    - guest: "178"
      expect: {quote: {status: offered, amount: "15.00"}, reply_contains: ["Mountain bike", "06.10.2026 14:00"]}

- name: mkt_ebike_rental_terms
  category: marketplace
  gate: true
  description: E-bike terms (deposit, minimum age, ID) are shown before consent.
  steps:
    - guest: "I need an e-bike for tomorrow afternoon"
