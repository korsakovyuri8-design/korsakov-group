# =========================================================== MULTI-SERVICE
- name: mkt_multi_transfer_skis_guide
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: >
    The demo: one message, three services, three providers. Only missing
    details are asked; three independent prices; the guest books two and
    defers one; the plan answers from stored state.
  steps:
    - guest: "We arrive from Podgorica Friday evening. There are four of us. Get us a transfer, two sets of skis for Saturday, and I'd like a Russian-speaking guide for Durmitor on Sunday."
      expect:
        reply_contains: ["What time on 15.01.2027", "heights (cm)", "180.00 EUR", "Demo Durmitor Private Tours",
                         "nothing is booked until you confirm"]
        forbidden: ["has been booked", "is confirmed"]
    - guest: "we land at 20:30"
      expect:
        quote: {status: offered, amount: "45.00"}
        reply_contains: ["pickup: Podgorica;", "15.01.2027 20:30", "heights (cm)"]
    - guest: "180 and 165"
      expect: {quote: {status: offered, amount: "50.00"}}
    - guest: "Book the transfer and the guide. I'll decide about the skis later."
      expect:
        reply_contains: ["Demo Transfers", "Demo Durmitor Private Tours", "Still open, not booked"]
        forbidden: ["sending your booking to Demo Ski & Board"]
    - guest: "What do we have for Sunday?"
      expect: {reply_contains: ["provisional - subject to weather, not confirmed"]}
    - guest: "What do we have booked for Saturday?"
      expect: {reply_contains: ["price offered - not booked"], forbidden: ["CONFIRMED"]}
    - guest: "What do we have on Friday?"
      expect: {reply_contains: ["CONFIRMED by provider"]}
  final:
    bookings: ["airport_transfer:accepted", "guide_booking:pending_condition"]
    quotes: [accepted_by_guest, accepted_by_guest, offered]
    provider_bookings: 2

- name: mkt_multi_cancel_one_keeps_others
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Cancelling one service leaves the others untouched.
  steps:
    - guest: "We arrive Friday at 8pm, there are two of us. Get us a transfer from Podgorica. We want two sets of skis Saturday morning, we are 180 and 170 cm tall. And a Russian-speaking guide for Durmitor on Sunday."
    - guest: "book all"
      expect: {reply_contains: ["Demo Transfers", "Demo Ski & Board", "Demo Durmitor Private Tours"]}
    - guest: "Cancel the transfer"
      expect: {reply_contains: ["free cancellation period"], forbidden: ["Ski", "guide"]}
  final:
    bookings: ["airport_transfer:cancelled", "rental:accepted", "guide_booking:pending_condition"]
    provider_bookings: 2
