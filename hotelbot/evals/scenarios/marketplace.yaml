- name: mkt_guide_private_vs_group
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Private and group options are two separate offers; a bare "yes" books neither.
  steps:
    - guest: "We'd like a hiking guide on Saturday for 2, in English"
      expect:
        reply_contains: ["2 options", "Guided group hike", "70.00 EUR", "Private mountain guide", "150.00 EUR"]
    - guest: "yes"
      expect: {reply_contains: ["several open offers"], actions: []}
  final: {quotes: [offered, offered], transactions: []}

- name: mkt_guide_weather_dependent
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: >
    A weather-dependent tour is PROVISIONAL after the provider's first answer
    (never "confirmed"); it becomes confirmed only on the provider's
    unconditional confirmation callback.
  steps:
    - guest: "We want a guide for Durmitor tomorrow who speaks Russian. We are 2."
    - guest: "yes"
      expect:
        notifications_contain: ["provisionally accepted", "subject to the weather", "not confirmed yet"]
        notifications_forbidden: ["has accepted your booking"]
        transaction: {status: pending_condition}
    - provider_callback: {event: condition_met, event_id: wx-1, provider: demo-durmitor-private}
      expect:
        callback_status: 200
        notifications_contain: ["has accepted your booking"]
  final: {bookings: ["guide_booking:accepted"]}

- name: mkt_guide_weather_called_off
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: The provider calls the tour off for weather - the guest is told it is cancelled.
  steps:
    - guest: "We want a guide for Durmitor tomorrow who speaks Russian. We are 2."
    - guest: "yes"
    - provider_callback: {event: condition_failed, event_id: wx-2, provider: demo-durmitor-private}
      expect: {callback_status: 200, notifications_contain: ["because of the weather", "cancelled"]}
  final: {bookings: ["guide_booking:cancelled"]}

- name: mkt_guide_late_cancellation
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Cancelling tomorrow's guide is past the 24 h window - the fee is stated before anything is cancelled.
  steps:
    - guest: "We want a guide for Durmitor tomorrow who speaks Russian. We are 2."
    - guest: "yes"
    - guest: "Cancel tomorrow's guide"
      expect: {reply_contains: ["Free cancellation", "full price", "Nothing has been cancelled yet"]}
    - guest: "yes, cancel"
      expect: {notifications_contain: ["has been cancelled"]}
  final: {bookings: ["guide_booking:cancelled"]}

- name: mkt_hourly_city_tour
