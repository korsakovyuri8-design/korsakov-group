- name: mkt_car_minimum_duration
  category: marketplace
  gate: true
  clock_start: "2027-01-11T09:00:00+00:00"
  description: Five hours is below the provider's 24-hour minimum - no quote.
  steps:
    - guest: "Can I rent a car for 5 hours tomorrow at 10?"
      expect: {no_new_quote: true, reply_contains: ["minimum rental period"]}

