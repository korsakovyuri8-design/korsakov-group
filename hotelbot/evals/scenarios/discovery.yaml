# DISCOVERY - Iteration 4: Local World / Discovery Engine.
#
# Invariants under test (gates): candidates only from structured world data;
# a known-closed place is never recommended for an explicit time; kitchen
# availability is never claimed from venue hours or unknown data; hard
# diet / age / group / radius / exclusion constraints are never relaxed;
# expired events never appear as upcoming; SAVE / PLAN never become a
# transaction; a reservation is never claimed from discovery state; stale
# or unknown data is disclosed; distance is computed, never invented.
#
# Clocks (UTC -> Europe/Podgorica):
#   default             Mon 2026-10-05 12:00Z = Mon 14:00 local
#   2026-10-09T18:00Z   Fri 20:00 local       2026-10-10T13:00Z  Sat 15:00 local
#   2027-01-11T09:00Z   Mon 10:00 local (Fri = 15.01, Sat = 16.01, Sun = 17.01)
#   2027-01-13T11:00Z   Wed 12:00 local       2027-01-17T09:00Z  Sun 10:00 local
# Data: data/regions/zabljak_demo.yaml (synthetic).

# ------------------------------------------------------------ open state
- name: disc_open_now_hard
  category: discovery
  gate: true
  description: Monday 14:00 - every bar is closed or opens later; "open now" never returns one.
  steps:
    - guest: "Is there a bar open now nearby?"
      expect:
        reply_contains: ["couldn't find anything", "closed at that time"]
        forbidden: ["Pub Demo", "Bar Demo Koktel", "open until"]
        outcomes: [FIND]

- name: disc_open_later_time
  category: discovery
  description: Monday 21:00 - only the pub is open then; bars closed on Mondays never appear.
  steps:
    - guest: "Find a bar for tonight at 21:00"
      expect:
        reply_contains: ["Pub Demo", "open until 00:00"]
        forbidden: ["Bar Demo Koktel", "Vinski Bar Demo", "Demo Rooftop Lounge"]

- name: disc_kitchen_closed_venue_open
  category: discovery
  gate: true
  description: At 22:45 Ponoć is still open but its kitchen closed at 22:00 - it is not offered for food.
  steps:
    - guest: "Where can we still eat tonight at 22:45?"
      expect:
        reply_contains: ["Pizzeria Demo", "kitchen until 23:30"]
        forbidden: ["Restoran Demo Ponoć", "Konoba Demo Durmitor"]

- name: disc_unknown_hours_never_claimed
  category: discovery
  gate: true
  description: At 23:30 only a place WITHOUT hours data remains - shown with the gap disclosed, never as open/serving.
  steps:
    - guest: "Find somewhere local to eat tonight at 23:30"
      expect:
        reply_contains: ["Grill Demo Bobotov", "no opening-hours data", "kitchen hours not known"]
        forbidden: ["open until", "kitchen until", "kitchen open at", "Restoran Demo Ponoć"]

- name: disc_temporary_closure
  category: discovery
  gate: true
  description: Konoba Demo Stari Mlin is closed for renovation in January - never offered while closed.
  clock_start: "2027-01-13T11:00:00+00:00"
  steps:
    - guest: "Find a local restaurant open now"
      expect:
        reply_contains: ["Konoba Demo Durmitor"]
        forbidden: ["Stari Mlin"]

- name: disc_stale_hours_disclosed
  category: discovery
  gate: true
  description: Club hours were last verified in September - in January that is disclosed, not presented as current.
  clock_start: "2027-01-11T09:00:00+00:00"
  steps:
    - guest: "Find a nightclub"
      expect:
        reply_contains: ["Club Demo", "closed now", "last verified", "may have changed"]

- name: disc_fresh_not_flagged
  category: discovery
  description: Recently verified hours carry no staleness warning.
  clock_start: "2027-01-11T09:00:00+00:00"
  steps:
    - guest: "Find a rooftop bar"
      expect:
        reply_contains: ["Demo Rooftop Lounge"]
        forbidden: ["last verified"]

# ----------------------------------------------------- hard vs soft diet
- name: disc_diet_hard_filters
  category: discovery
  gate: true
  description: '"with vegan options" is a hard constraint - no cocktail bar has them, so nothing is suggested.'
  clock_start: "2026-10-09T18:00:00+00:00"
  steps:
    - guest: "Find a cocktail bar with vegan options"
      expect:
        reply_contains: ["couldn't find anything"]
        forbidden: ["Bar Demo Koktel", "Demo Rooftop Lounge"]

- name: disc_diet_soft_keeps_results
  category: discovery
  description: '"vegan options would be nice" is a preference - it ranks, it does not filter.'
  clock_start: "2026-10-09T18:00:00+00:00"
  steps:
    - guest: "Find a cocktail bar for tonight, vegan options would be nice"
      expect:
        reply_contains_any: ["Bar Demo Koktel", "Demo Rooftop Lounge"]

- name: disc_gluten_free_hard
  category: discovery
  gate: true
  description: Gluten-free is a filter; places without it never appear.
  steps:
    - guest: "We need a restaurant with gluten-free food"
