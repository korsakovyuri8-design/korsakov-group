- name: adv_event_series_vs_duplicate
  category: world
  gate: true
  description: '"Jazz Night" every Friday at one venue = separate instances; the same Friday from a second feed = the same event.'
  clock_start: "2027-01-11T09:00:00+00:00"
  world_sources:
    - {source_id: "tour:me", source_class: tourism_feed}
    - {source_id: "tix:demo", source_class: ticketing_partner}
  steps:
    - world: {sync: {source: "tour:me", records: [
        {id: "j15", type: event, title: "Jazz Night", category: concert, start: "2027-01-15T21:00:00", lat: 43.1552, lon: 19.1214},
        {id: "j22", type: event, title: "Jazz Night", category: concert, start: "2027-01-22T21:00:00", lat: 43.1552, lon: 19.1214},
        {id: "j29", type: event, title: "Jazz Night", category: concert, start: "2027-01-29T21:00:00", lat: 43.1552, lon: 19.1214}]}}
    - world: {sync: {source: "tix:demo", records: [{id: "TX-22", type: event, title: "Jazz Night", category: concert, start: "2027-01-22T21:00:00+01:00", lat: 43.15521, lon: 19.12141, price: 10, currency: EUR}]}}
      expect:
        world:
          entities: 3
          same: [[{source: "tour:me", id: "j22"}, {source: "tix:demo", id: "TX-22"}]]
          distinct: [[{source: "tour:me", id: "j15"}, {source: "tour:me", id: "j22"}, {source: "tour:me", id: "j29"}]]

- name: adv_event_time_change
  category: world
  gate: true
  description: The organizer moves a concert from 20:00 to 21:00 - same event; the organizer's new time wins; the old assertion stays in history.
  clock_start: "2027-01-11T09:00:00+00:00"
  world_sources:
    - {source_id: "tour:me", source_class: tourism_feed}
    - {source_id: "org:kc", source_class: organizer}
  steps:
    - world: {sync: {source: "tour:me", records: [{id: "e1", type: event, title: "Winter Strings", category: concert, start: "2027-01-23T20:00:00", lat: 43.1555, lon: 19.1222}]}}
    - world: {sync: {source: "org:kc", records: [{id: "ws", type: event, title: "Winter Strings", category: concert, start: "2027-01-23T20:00:00", lat: 43.1555, lon: 19.1222}]}}
      expect:
        world: {entities: 1}
    - world: {sync: {source: "org:kc", records: [{id: "ws", type: event, title: "Winter Strings", category: concert, start: "2027-01-23T21:00:00", lat: 43.1555, lon: 19.1222}]}}
      expect:
        world:
          entities: 1
          resolution: [{entity: {source: "org:kc", id: "ws"}, field: start_at, value: "2027-01-23T20:00:00+00:00", source: "org:kc", conflicting: 1}]
          changes: [field_changed]

- name: adv_stale_authority_vs_fresh_weak_90d
  category: world
  description: Owner hours 90 days old (aging, not yet stale) vs directory verified today - policy (authority within SLA) decides, and says why.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "own:polar", source_class: provider_owned}
  steps:
    - world: {sync: {source: "own:polar", records: [{id: "polar", name: "Sladoled Polar", lat: 43.1470, lon: 19.1470, category: dessert, opening_hours: "Mo-Su 10:00-00:00", updated_at: "2026-07-07T12:00:00+02:00"}]}}
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Sladoled Polar", lat: 43.14701, lon: 19.14702, category: dessert, opening_hours: "Mo-Su 10:00-22:00", updated_at: "2026-10-05T09:00:00+02:00"}]}}
      expect:
        world:
          resolution: [{entity: {source: "dir:a", id: "1"}, field: opening_hours, source: "own:polar", state: contested, conflicting: 1, reason_contains: "authority"}]

- name: adv_temporary_closure_precedence
  category: world
  gate: true
  description: A fresh owner-reported temporary closure dominates otherwise valid opening hours for its interval.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "own:kamen", source_class: provider_owned}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Galerija Kamen", lat: 43.1460, lon: 19.1460, category: gallery, opening_hours: "Mo-Su 09:00-19:00"}]}}
    - world: {sync: {source: "own:kamen", records: [{id: "k", name: "Galerija Kamen", lat: 43.14601, lon: 19.14601, category: gallery, temporary_closure: {from: "2026-10-04", to: "2026-10-08", reason: "staff training"}}]}}
    - guest: "Is there a gallery open now?"
      expect: {forbidden: ["Galerija Kamen (gallery) - open"]}
    - guest: "Find a gallery"
      expect: {reply_contains: ["Galerija Kamen", "temporarily closed (staff training)"]}

- name: adv_wrong_merge_then_split
  category: world
  gate: true
  description: An operator wrongly merges an unrelated cafe into a booked restaurant, then splits it - everything recovers; the booking is untouched.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
  steps:
    - guest: "Find a local restaurant for dinner tonight at 20:00, we are 2"
    - guest: "book 1"
    - guest: "yes"
      expect: {notifications_contain: ["has accepted your booking"]}
    - world: {sync: {source: "dir:a", records: [{id: "lipa", name: "Kafe Lipa", lat: 43.1430, lon: 19.1430, category: cafe, opening_hours: "Mo-Su 08:00-20:00"}]}}
    - world: {merge: {keep: {source: "synthetic:zabljak-demo", id: "restoran-demo-ponoc"}, other: {source: "dir:a", id: "lipa"}}}
      expect: {world: {transactions_unchanged: true}}
    - world: {split: {entity: {source: "dir:a", id: "lipa"}}}
      expect:
        world:
          transactions_unchanged: true
          distinct: [[{source: "dir:a", id: "lipa"}, {source: "synthetic:zabljak-demo", id: "restoran-demo-ponoc"}]]
          places: [{entity: {source: "synthetic:zabljak-demo", id: "restoran-demo-ponoc"}, active: true, name: "Restoran Demo Ponoć"},
                   {entity: {source: "dir:a", id: "lipa"}, active: true, name: "Kafe Lipa"}]
          resolution: [{entity: {source: "synthetic:zabljak-demo", id: "restoran-demo-ponoc"}, field: name, conflicting: 0},
                       {entity: {source: "dir:a", id: "lipa"}, field: opening_hours, conflicting: 0}]
    - guest: "my plan"
      expect: {reply_contains: ["Restoran Demo Ponoć", "CONFIRMED by provider"]}
  final: {bookings: ["restaurant_reservation:accepted"]}

- name: adv_source_license_change
  category: world
  gate: true
  description: A source changes its terms (drops the attribution requirement). The change is recorded; data published under the old terms keeps its attribution.
  world_sources:
    - {source_id: "osm:test", source_class: directory, license: "ODbL-1.0", attribution_required: true, attribution_text: "© OpenStreetMap contributors (test)", redistribution: attribution}
  steps:
    - world: {sync: {source: "osm:test", records: [{id: "n1", name: "Sladoled Polar", lat: 43.1470, lon: 19.1470, category: dessert}]}}
    - world: {sync: {source: "osm:test", descriptor: {license: "CC0-1.0", attribution_required: false, redistribution: allowed}, records: [{id: "n1", name: "Sladoled Polar", lat: 43.1470, lon: 19.1470, category: dessert}]}}
      expect:
        world:
          changes: [source_terms_changed]
          places: [{entity: {source: "osm:test", id: "n1"}, attribution: ["osm:test"]}]

- name: adv_source_clock_skew
  category: world
  gate: true
  description: A source stamps its record five months in the FUTURE - impossible freshness must not make it win.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "dir:c", source_class: directory}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Sladoled Polar", lat: 43.1470, lon: 19.1470, category: dessert, opening_hours: "Mo-Su 10:00-23:00", updated_at: "2026-10-04T10:00:00+02:00"}]}}
    - world: {sync: {source: "dir:c", records: [{id: "2", name: "Sladoled Polar", lat: 43.14701, lon: 19.14702, category: dessert, opening_hours: "Mo-Su 10:00-02:00", updated_at: "2027-03-01T10:00:00+01:00"}]}}
      expect:
        world:
          resolution: [{entity: {source: "dir:a", id: "1"}, field: opening_hours, not_source: "dir:c"}]

- name: adv_identifier_collision
  category: world
  gate: true
  description: Two unrelated businesses 1.2 km apart wrongly carry the same external id - AMBIGUOUS and reviewed, not merged.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "dir:c", source_class: directory}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Galerija Kamen", lat: 43.1400, lon: 19.1400, phone: "069 111 000", category: gallery, ids: {tripdir: "T-555"}}]}}
    - world: {sync: {source: "dir:c", records: [{id: "2", name: "Restoran Vidikovac", lat: 43.1508, lon: 19.1400, phone: "067 222 000", category: restaurant, ids: {tripdir: "T-555"}}]}}
      expect:
        world:
          entities: 2
          distinct: [[{source: "dir:a", id: "1"}, {source: "dir:c", id: "2"}]]
          reviews_open: 1
