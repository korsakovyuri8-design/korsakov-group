# WORLD (adversarial) - identity and fact-resolution edge cases.
#
# Written as DESIRED behaviour before running (raw-first). Each case targets
# a known way entity resolution / field resolution goes wrong in real data.
# Default clock: Mon 2026-10-05 12:00Z (14:00 local).

- name: adv_business_relocation
  category: world
  description: >
    Same name, phone and website; the directory still has the old address
    (8 months old), the business's partner feed has the new one 2 km away.
    Strong identity evidence -> ONE entity; the old location is kept as
    history/dissent; the current location follows the coordinates policy.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "partner:b", source_class: partner_feed}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Restoran Lipa", lat: 43.1400, lon: 19.1400, phone: "069 444 555", website: "restoran-lipa.me", category: restaurant, updated_at: "2026-02-01T10:00:00+01:00"}]}}
    - world: {sync: {source: "partner:b", records: [{id: "lipa", name: "Restoran Lipa", lat: 43.1580, lon: 19.1420, phone: "+382 69 444 555", website: "https://restoran-lipa.me", category: restaurant, updated_at: "2026-10-01T10:00:00+02:00"}]}}
      expect:
        world:
          entities: 1
          same: [[{source: "dir:a", id: "1"}, {source: "partner:b", id: "lipa"}]]
          resolution: [{entity: {source: "dir:a", id: "1"}, field: coordinates, value: {lat: 43.158, lon: 19.142}, source: "partner:b", conflicting: 1}]
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Restoran Lipa", lat: 43.1580, lon: 19.1420, phone: "069 444 555", website: "restoran-lipa.me", category: restaurant, updated_at: "2026-10-03T10:00:00+02:00"}]}}
      expect:
        world:
          resolution: [{entity: {source: "dir:a", id: "1"}, field: coordinates, conflicting: 0, state: resolved}]
          changes: [field_changed]

- name: adv_business_replaced_same_location
  category: world
  gate: true
  description: An old restaurant closed; a new, unrelated one opened at exactly the same coordinates. Same spot is not identity.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "dir:c", source_class: directory}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Restoran Stari Most", lat: 43.1410, lon: 19.1410, phone: "069 100 200", category: restaurant, updated_at: "2025-03-01T10:00:00+01:00"}]}}
    - world: {sync: {source: "dir:c", records: [{id: "2", name: "Restoran Plava Ruža", lat: 43.1410, lon: 19.1410, phone: "067 300 400", category: restaurant, updated_at: "2026-10-01T10:00:00+02:00"}]}}
      expect:
        world: {entities: 2, distinct: [[{source: "dir:a", id: "1"}, {source: "dir:c", id: "2"}]]}

