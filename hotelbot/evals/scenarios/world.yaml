    - world: {sync: {source: "dir:c", records: [{id: "2", name: "Restoran Vidikovac Sunce", lat: 43.14301, lon: 19.14301, phone: "067 999 888", category: restaurant, updated_at: "2026-10-02T10:00:00+02:00"}]}}
      expect:
