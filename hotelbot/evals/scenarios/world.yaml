# WORLD - Iteration 5: Global World Data Fabric.
#
# Several sources describe the same (or almost the same) world. Invariants
# (gates): no silent destructive merge; no source record loss; no LLM truth
# resolution; no false canonical deactivation from one missing source; no
# silent conflict erasure; no transaction mutation from world sync; no
# licensing metadata loss; no traveller data in world records.
#
# Records use the generic directory-like format (app/world/normalize.py).
# Test businesses sit around 43.140,19.140 (south-east of the demo town,
# inside the zabljak-demo coverage area, away from the synthetic pack).
# Default clock: Mon 2026-10-05 12:00Z (14:00 local).

# ------------------------------------------------------------- identity
- name: world_identical_two_sources
  category: world
  gate: true
  description: The same restaurant from a directory and a partner feed is ONE entity with BOTH source records kept.
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "partner:b", source_class: partner_feed}
  steps:
    - world:
        sync: {source: "dir:a", records: [{id: "r1", name: "Konoba Stari Grad", lat: 43.14000, lon: 19.14000,
               phone: "069 111 222", category: restaurant, updated_at: "2026-10-03T10:00:00+02:00"}]}
    - world:
        sync: {source: "partner:b", records: [{id: "p-77", name: "Konoba Stari Grad", lat: 43.14001, lon: 19.14002,
               phone: "+382 69 111 222", category: restaurant, updated_at: "2026-10-04T10:00:00+02:00"}]}
      expect:
        world:
          entities: 1
          same: [[{source: "dir:a", id: "r1"}, {source: "partner:b", id: "p-77"}]]
          source_entities: 2
          changes: [linked]

- name: world_translated_type_word
  category: world
  description: '"Konoba Stari Grad", "Stari Grad Restaurant" and "Konoba Stari Grad Žabljak" at one spot are one place.'
  world_sources:
    - {source_id: "dir:a", source_class: directory}
    - {source_id: "dir:c", source_class: directory}
    - {source_id: "partner:b", source_class: partner_feed}
  steps:
    - world: {sync: {source: "dir:a", records: [{id: "1", name: "Konoba Stari Grad", lat: 43.1400, lon: 19.1400, category: restaurant}]}}
    - world: {sync: {source: "dir:c", records: [{id: "x9", name: "Stari Grad Restaurant", lat: 43.14004, lon: 19.14003, category: restaurant}]}}
    - world: {sync: {source: "partner:b", records: [{id: "k", name: "Konoba Stari Grad Žabljak", lat: 43.13998, lon: 19.14001, category: restaurant}]}}
      expect:
        world:
          entities: 1
          same: [[{source: "dir:a", id: "1"}, {source: "dir:c", id: "x9"}, {source: "partner:b", id: "k"}]]

