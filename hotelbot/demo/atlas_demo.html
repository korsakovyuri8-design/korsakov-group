<title>Korsakov Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a five-step walkthrough rail beside one Atlas trip card; stacks to one column on a phone. */
:root {
  --bg: #eef1f0;          /* Kotor limestone in shade */
  --surface: #ffffff;
  --ink: #12222e;         /* bay at dusk */
  --muted: #5a6a73;
  --line: #d5dcdc;
  --accent: #0b6b78;      /* Adriatic */
  --accent-soft: #dcecee;
  --warn: #9a5a00;
  --warn-soft: #fbefdc;
  --free: #1f7a4d;
  --free-soft: #dff1e6;
  --display: "Gloock", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1620; --surface: #142230; --ink: #e4ebee; --muted: #93a4ad; --line: #24384a;
    --accent: #5cc3cf; --accent-soft: #163b45; --warn: #f0b45a; --warn-soft: #3a2a12;
    --free: #6fd29d; --free-soft: #143525; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1620; --surface: #142230; --ink: #e4ebee; --muted: #93a4ad; --line: #24384a;
  --accent: #5cc3cf; --accent-soft: #163b45; --warn: #f0b45a; --warn-soft: #3a2a12;
  --free: #6fd29d; --free-soft: #143525; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 24px 40px; } }

/* rail */
.brand { font-family: var(--display); font-size: 30px; letter-spacing: .06em; line-height: 1.1; margin: 0; }
.tagline { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.steps { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 4px; counter-reset: step; }
.steps button { width: 100%; text-align: left; font: inherit; color: var(--muted); background: none; border: 0;
  padding: 10px 12px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
.steps button:hover { background: var(--accent-soft); color: var(--ink); }
.steps button[aria-current="step"] { background: var(--surface); color: var(--ink); font-weight: 600;
  box-shadow: 0 0 0 1px var(--line); }
.steps .n { font-family: var(--mono); font-size: 13px; padding-top: 2px; }
.rail-note { margin-top: 28px; font-size: 12.5px; color: var(--muted); max-width: 34ch; }
@media (max-width: 760px) {
  .steps { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 20px; }
  .steps button { grid-template-columns: 1fr; text-align: center; padding: 8px 4px; }
  .steps .label { display: none; }
  .rail-note { display: none; }
}

/* card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.card-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap;
  justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.scene-title { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 2px 0 0; text-wrap: balance; }
.docs { display: flex; flex-wrap: wrap; gap: 6px; }
.doc { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.card-body { padding: 24px; display: grid; gap: 20px; min-width: 0; }
.card-foot { padding: 16px 24px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px;
  justify-content: space-between; align-items: center; }

.route { font-family: var(--display); font-size: clamp(26px, 5vw, 40px); line-height: 1.15; margin: 0; text-wrap: balance; }
.route .arrow { color: var(--accent); }
.dates { font-family: var(--mono); color: var(--muted); margin: 6px 0 0; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 0;
  border-top: 1px solid var(--line); align-items: baseline; }
.list li:first-child { border-top: 0; }
.list .what { font-weight: 600; min-width: 0; }
.list .when { font-family: var(--mono); font-size: 13px; color: var(--muted); grid-column: 1; }
.pill { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; border-radius: 999px;
  padding: 2px 9px; color: var(--free); background: var(--free-soft); grid-row: 1 / span 2; grid-column: 2; align-self: center; }

.alert { background: var(--warn-soft); border-radius: 10px; padding: 18px 20px; display: grid; gap: 6px; }
.alert h3 { margin: 0; color: var(--warn); font-size: 17px; }
.alert p { margin: 0; }
.plan { color: var(--muted); margin: 0; font-size: 14px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline time { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 1px; }
.timeline .free { background: var(--free-soft); border-radius: 8px; border-top-color: transparent; padding-inline: 10px; margin-inline: -10px; }
.timeline .free time, .timeline .free span { color: var(--free); font-weight: 600; }
.timeline .assumed { font-size: 12px; color: var(--muted); }
@media (max-width: 460px) { .timeline li { grid-template-columns: 92px minmax(0, 1fr); } }

.headline { font-family: var(--display); font-size: clamp(26px, 4vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; font-weight: 400; }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .picks { grid-template-columns: minmax(0, 1fr); } }
.pick { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.pick h4 { margin: 0; font-size: 16px; }
.pick .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.legs { font-family: var(--mono); font-size: 12.5px; display: grid; gap: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legs b { color: var(--ink); font-weight: 600; }
.fineprint { font-size: 12.5px; color: var(--muted); margin: 0; }

.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:hover { filter: brightness(1.05); }
.btn:focus-visible, .steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.finale { text-align: left; padding: 8px 0 4px; display: grid; gap: 8px; }
.finale .brand { font-size: clamp(28px, 6vw, 44px); }
.finale p { margin: 0; font-size: 18px; }
.finale .cta { color: var(--accent); font-weight: 600; }
.imported { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 6px; letter-spacing: .02em; }
.detail { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
.status { justify-self: start; font-size: 13px; font-weight: 600; color: var(--warn); border: 1px solid var(--warn);
  border-radius: 999px; padding: 4px 12px; }
.results { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.results li { border-top: 2px solid var(--accent); padding-top: 8px; display: grid; gap: 2px; }
.results b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.results span { font-size: 13px; color: var(--muted); }
.positioning { margin: 0; max-width: 62ch; }
.narration { margin: 0; border-left: 3px solid var(--accent); padding: 6px 0 6px 16px; font-family: var(--display);
  font-size: 19px; line-height: 1.4; color: var(--ink); }
.toggle { margin-top: 20px; font-size: 13px; }

@media (prefers-reduced-motion: no-preference) {
  .card-body > * { animation: rise .32s ease both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <aside>
    <h1 class="brand">KORSAKOV ATLAS</h1>
    <p class="tagline" id="tagline">Your entire trip, understood.</p>
    <ol class="steps" id="steps"></ol>
    <button class="btn toggle" id="narrate" type="button" aria-pressed="false">Show narration</button>
    <p class="rail-note" id="rail-note"></p>
  </aside>
  <main class="card" aria-live="polite">
    <header class="card-head">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h2 class="scene-title" id="scene-title"></h2>
      </div>
      <div class="docs" id="docs"></div>
    </header>
    <section class="card-body" id="body"></section>
    <footer class="card-foot">
      <span class="fineprint" id="where"></span>
      <div class="foot-actions">
        <button class="btn" id="back" type="button">Back</button>
        <button class="btn primary" id="next" type="button">Next</button>
      </div>
    </footer>
  </main>
</div>

t 15:00 — 5 min after landing; getting out of the airport takes about 45.", "Your existing transfer may no longer fit."], "plan": "By your plan you are still due at Konoba Demo at 20:00; the free time before it is on hold until the transfer is sorted.", "status": "Transfer needs rebooking", "title": "A flight change arrives"}], "summary": {"activities_that_fit": 3, "bookings": 4, "disruptions": 1, "documents": 5, "missing_connections": 1}, "world": "synthetic demo world (data/trips/demo_world.yaml)"}</script><!--/ATLAS-DATA-->

<script>
(() => {
  const data = JSON.parse(document.getElementById("atlas-data").textContent);
  const scenes = data.scenes || [];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtDay = (iso) => { const d = new Date(iso + "T12:00:00Z"); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }); };
  const when = (b) => b.when.replace(/(\d{4}-\d{2}-\d{2})/g, (m) => fmtDay(m));
  const SAY = {
    bookings: "Imagine you’re travelling from London to Montenegro. You forward Atlas three confirmations. Atlas understands the entire trip, not just the hotel.",
    problem: "It catches something a booking site doesn’t: you land in Podgorica, but nothing gets you to Kotor.",
    rebuilt: "Once transport is confirmed, Atlas rebuilds the day.",
    suggestions: "Instead of suggesting random attractions, it finds only things you can actually reach, visit, and still make dinner.",
    change: "Then your airline changes the flight. Atlas immediately understands what else may now break.",
    summary: "Every screen you just saw was computed from the bookings themselves.",
  };
  let narrate = location.hash === "#narration";
  try { narrate = narrate || localStorage.getItem("atlas-narration") === "1"; } catch (e) { /* storage unavailable */ }
  const NEXT = { problem: null, suggestions: "Flight change arrives", change: "See the summary" };
  let at = 0;

  const views = {
    bookings: (s) => `
      <div>${s.imported ? `<p class="imported">${s.imported.documents} confirmations imported · Atlas understood ${s.imported.bookings} bookings</p>` : ""}<p class="route">${s.route.map(esc).join(' <span class="arrow">→</span> ')}</p>
      <p class="dates">${esc(s.dates)}</p></div>
      <ul class="list">${s.bookings.map((b) => `
        <li><span class="what">${esc(b.title)}</span><span class="pill">${esc(b.status)}</span>
        <span class="when">${esc(when(b))} · ${esc(b.reference)}</span></li>`).join("")}</ul>`,
    problem: (s) => `
      <div class="alert" role="alert"><h3>Missing transport</h3>${s.lines.map((l) => `<p>${esc(l)}</p>`).join("")}</div>
      <p class="plan">Atlas won't plan free time after landing until it knows how you get to Kotor.</p>`,
    rebuilt: (s) => `
      <p class="eyebrow">${esc(s.day)}</p>
      <ol class="timeline">${s.itinerary.map((i) => `
        <li class="${i.kind === "free" ? "free" : ""}"><time>${esc(i.time)}</time>
        <span>${esc(i.label)}${i.assumed ? ' <span class="assumed">(estimated)</span>' : ""}${i.detail ? `<span class="detail">${esc(i.detail)}</span>` : ""}</span></li>`).join("")}</ol>`,
    suggestions: (s) => `
      <p class="headline">${esc(s.headline)}</p>
      <div class="picks">${s.suggestions.map((x) => `
        <article class="pick"><div><div class="kind">${esc(x.kind)}</div><h4>${esc(x.name)}</h4></div>
        <div class="legs">
          <span>Hotel → <b>${x.walk_there} min</b> walk</span>
          <span>Visit <b>${esc(x.visit_from)}–${esc(x.visit_to)}</b></span>
          <span>→ Dinner <b>${x.walk_on} min</b> walk</span>
        </div></article>`).join("")}</div>
      <p class="fineprint">${s.considered} places considered between ${esc(s.window.time)}. ${s.left_out} left out: closed during your free time, open too briefly, or too far to reach and still make dinner.</p>`,
    change: (s) => `
      <div class="alert" role="alert"><h3>${esc(s.headline)}</h3>${s.lines.map((l) => `<p>${esc(l)}</p>`).join("")}</div>
      <p class="plan">${esc(s.plan || "")}</p>
      ${s.status ? `<span class="status">${esc(s.status)}</span>` : ""}`,
  };

  const RESULTS = [["documents", "documents read"], ["bookings", "bookings understood"],
    ["missing_connections", "missing connection found"], ["activities_that_fit", "activities that fit"],
    ["disruptions", "disruption detected"]];
  const finale = () => `
    <div class="finale"><p class="brand">${esc(data.brand.name)}</p><p>${esc(data.brand.tagline)}</p>
    <p class="cta">${esc(data.brand.cta)}</p></div>
    <ul class="results">${RESULTS.filter(([k]) => data.summary && k in data.summary).map(([k, label]) =>
      `<li><b>${data.summary[k]}</b><span>${label}</span></li>`).join("")}</ul>
    <p class="positioning">Korsakov Atlas is the operating layer for a trip. It understands bookings, builds the journey,
    catches broken connections, uses the real world around you, and keeps the plan coherent when something changes.</p>
    <p class="fineprint">Every screen here was computed by the Atlas pipeline from sample booking emails, offline.
    Places, hours and walking times come from a synthetic demo world. Trip policy ${esc(data.policy_version)}.</p>`;

  function render() {
    const total = scenes.length + 1;
    $("steps").innerHTML = [...scenes.map((s) => s.title), "Summary"].map((t, i) => `
      <li><button type="button" data-i="${i}" ${i === at ? 'aria-current="step"' : ""}>
      <span class="n">${String(i + 1).padStart(2, "0")}</span><span class="label">${esc(t)}</span></button></li>`).join("");
    const s = scenes[at];
    $("eyebrow").textContent = `Scene ${at + 1} of ${total}`;
    $("scene-title").textContent = s ? s.title : "Your entire trip, understood";
    $("docs").innerHTML = (s && s.documents ? s.documents : []).map((d) => `<span class="doc">+ ${esc(d)}</span>`).join("");
    const line = narrate ? `<blockquote class="narration">${esc(SAY[s ? s.id : "summary"])}</blockquote>` : "";
    $("body").innerHTML = line + (s ? views[s.id](s) : finale());
    $("narrate").textContent = narrate ? "Hide narration" : "Show narration";
    $("narrate").setAttribute("aria-pressed", String(narrate));
    $("where").textContent = s && s.id === "suggestions" ? `Free time ${s.window.time} · hotel to dinner` : "Kotor trip · 18–21 October";
    $("back").disabled = at === 0;
    const next = $("next");
    next.hidden = at === total - 1;
    next.textContent = s ? (s.id === "problem" ? s.action : s.id === "rebuilt" ? "Find things to do" : NEXT[s.id] || "Next") : "Next";
    $("rail-note").textContent = "Scenes are played back from one offline run of the pipeline. Nothing on them is typed in by hand.";
  }

  $("steps").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) { at = +b.dataset.i; render(); } });
  $("narrate").addEventListener("click", () => {
    narrate = !narrate;
    try { localStorage.setItem("atlas-narration", narrate ? "1" : "0"); } catch (e) { /* storage unavailable */ }
    render();
  });
  $("next").addEventListener("click", () => { at = Math.min(at + 1, scenes.length); render(); });
  $("back").addEventListener("click", () => { at = Math.max(at - 1, 0); render(); });
  if (!scenes.length) { $("body").innerHTML = '<p class="plan">No scene data. Run: python -m app.trip.atlas_demo --html demo/atlas_demo.html</p>'; return; }
  render();
})();
</script>
