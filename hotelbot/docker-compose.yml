services:
  db:
    image: pgvector/pgvector:pg16   # plain Postgres today; pgvector ready for embedding retrieval
    environment:
      POSTGRES_USER: hotelbot
      POSTGRES_PASSWORD: hotelbot
      POSTGRES_DB: hotelbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelbot"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HOTELBOT_DATABASE_URL: postgresql+psycopg://hotelbot:hotelbot@db:5432/hotelbot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro   # swap the knowledge pack without rebuilding

volumes:
  pgdata:
