# =============================================================================
#  SYNTHETIC DEVELOPMENT DATA - NOT REAL HOTEL INFORMATION
# =============================================================================
#  Every value in this file is invented for development and testing.
#  None of it describes Hotel Aleksandar (Žabljak) or any real hotel.
#  Replace this pack with the official "Informacije o Hotelu" data once
#  available (see README: "Replacing the knowledge pack").
# =============================================================================

pack:
  property_slug: example-hotel
  property_name: "Demo Mountain Hotel (synthetic data)"
  property_type: hotel
  timezone: Europe/Podgorica
  default_language: en
  emergency_number: "112"
  region: zabljak-demo
  location: {lat: 43.1556, lon: 19.1210}
  source: "synthetic-dev-dataset"
  synthetic: true
  version: "0.2"

# What this property can DO through the bot, and how. Anything not listed is
# explained as unavailable instead of being faked.
capabilities:
  actions:
    late_arrival_request:  {executor: staff}
    early_checkin_request: {executor: staff}
    late_checkout_request: {executor: staff}
    housekeeping_request:  {executor: staff}
    maintenance_request:   {executor: staff}
    restaurant_booking:    {executor: staff}
    transport_booking:     {executor: staff}
    booking_inquiry:       {executor: staff}
    staff_question:        {executor: staff}
  # External, transactional services: quote -> explicit guest consent -> provider.
  services:
    airport_transfer: {provider: demo-transfers}
    taxi:             {provider: demo-transfers}
    # Fulfilled by region-scoped providers (data/regions/zabljak_demo.yaml)
    restaurant_reservation: {}
    bar_table: {}
    ski_rental: {}
    guide_booking: {}
  integrations: [human_staff]
  external_services: [transport, activities]

# External providers (SYNTHETIC). Secrets are referenced by env-var name only.
providers:
  - slug: demo-transfers
    name: "Demo Transfers (synthetic)"
    provider_type: transport
    integration_type: mock
    services: [airport_transfer, taxi]
    config:
      currency: EUR
      pricing: {base: 30, per_extra_person: 5, night_surcharge: 10}
      # Synthetic: typical Podgorica airport -> Žabljak journey, used only to
      # estimate arrival for a trip plan (always shown as an estimate).
      estimated_duration_minutes: 150
      validity_minutes: 15
      conditions: "Price per vehicle. Free cancellation up to 2 hours before pickup."
      callback_secret_env: DEMO_TRANSFERS_CALLBACK_SECRET

# Conversation policy (see FailurePolicy). Omitted keys use deployment defaults.
policy:
  max_consecutive_failures: 2

items:
  - key: check_in_out_times
    category: check_in_out
    content:
      en: "Check-in is from 14:00 and check-out is until 11:00."
      cnr: "Prijava (check-in) je od 14:00, a odjava (check-out) do 11:00."
    keywords:
      en: [check-in, checkin, check-out, checkout, arrival, departure, arrive, leave]
      cnr: [prijava, odjava, dolazak, odlazak, ulazak, napuštanje, sobe]
      ru: [заезд, выезд, заселение, регистрация]
    metadata: {synthetic: true}

  - key: late_arrival_policy
    category: check_in_out
    content:
      en: "Arrivals after 22:00 are possible but must be arranged with reception in advance. Late arrival is confirmed only by hotel staff."
      cnr: "Dolazak poslije 22:00 je moguć, ali se mora unaprijed dogovoriti sa recepcijom. Kasni dolazak potvrđuje isključivo osoblje hotela."
    keywords:
      en: [late, arrival, check-in, night, after, midnight, 11pm, "23"]
      cnr: [kasni, kasno, dolazak, prijava, noću, poslije, ponoć]
    metadata: {synthetic: true, requires_staff_approval: [late_check_in]}

  - key: early_late_checkout_policy
    category: check_in_out
    content:
      en: "Early check-in and late check-out depend on availability and must be approved by reception."
      cnr: "Raniji check-in i kasniji check-out zavise od raspoloživosti i mora ih odobriti recepcija."
    keywords:
      en: [early, late, check-out, checkout, check-in, extend, stay, longer]
      cnr: [rani, raniji, kasni, kasniji, odjava, prijava, produžiti, duže]
    metadata: {synthetic: true, requires_staff_approval: [early_check_in, late_check_out]}

  - key: breakfast
    category: dining
    content:
      en: "Breakfast is served buffet-style in the restaurant every day from 07:30 to 10:00 and is included in the room rate."
      cnr: "Doručak se služi na švedskom stolu u restoranu svakog dana od 07:30 do 10:00 i uključen je u cijenu sobe."
    keywords:
      en: [breakfast, morning, meal, buffet, food, eat]
      cnr: [doručak, jutro, obrok, švedski, sto, hrana, jelo]
      ru: [завтрак, утром, еда]
    metadata: {synthetic: true}

  - key: restaurant
    category: dining
    content:
      en: "The hotel restaurant serves lunch from 12:00 to 15:00 and dinner from 18:30 to 22:00, with local Durmitor-region dishes. Table reservations for groups are handled by reception."
      cnr: "Hotelski restoran služi ručak od 12:00 do 15:00 i večeru od 18:30 do 22:00, uz domaća jela durmitorskog kraja. Rezervacije stolova za grupe preuzima recepcija."
    keywords:
      en: [restaurant, lunch, dinner, food, eat, menu, table, local, dishes]
      cnr: [restoran, ručak, večera, hrana, jelo, meni, sto, domaća, jela]
