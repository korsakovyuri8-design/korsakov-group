# =============================================================================
#  SYNTHETIC DEVELOPMENT DATA - NOT REAL BUSINESSES
# =============================================================================
#  Every place, event, provider, price, schedule and availability below is
#  invented to exercise the Local Travel Infrastructure Layer. Names are
#  fictional ("Demo ..."). Real geography (Žabljak, Black Lake, Savin Kuk,
#  Podgorica) is used only for orientation. Replace with verified data,
#  partner feeds or provider integrations before any real use.
#
#  Deliberate variety (each one is exercised by an evaluation scenario):
#   - Konoba Demo Durmitor is closed on Mondays; its kitchen closes at 22:30
#   - Restoran Demo Ponoć keeps its kitchen open until midnight Fri/Sat
#   - Restoran Demo Jezero requires a reservation; fully vegetarian/vegan-friendly
#   - Bar Demo Koktel is open late (last entry 01:30) and lively
#   - Demo Apoteka Centar is closed on Sundays; Demo Apoteka Sjever is open
#   - "New Year concert" is in the past and must never be recommended
#  Marketplace (providers are shared by every property in the region):
#   - Demo Transfers: cheap sedans (max 4 passengers, 4 bags), NO child seats
#   - Demo Premium Transfers: dearer minivan (8 passengers, 10 bags, 2 child
#     seats), only ONE minivan; supports in-place modification
#   - Demo Ski & Board: skis + snowboards by length; the Mali shop has 3 sets,
#     Savin Kuk has more (170 cm: 3 sets); winter season only
#   - Demo Bike & Trek: bicycles / e-bikes (half days), hiking + camping gear;
#     bikes only April-November
#   - Demo Car Hire: cars only, minimum 24 h, deposit, driver 21+
#   - Nobody rents scooters/motorbikes
#   - Guides: Peak Guides (EN/ME, group hike or private), Durmitor Private
#     (EN/RU, private, max 6, weather-dependent), Culture Walks (EN/DE, hourly)
# =============================================================================

