# Iteration 7, slice 1 - place -> IANA time zone, explicitly versioned (D-079).
# Hand-curated for the fixture set only: OurAirports' airports.csv carries
# coordinates but no time-zone column, so a full airport snapshot needs a
# coordinate -> IANA resolver (a later, separate step). A code not listed
# here has an UNKNOWN zone - never guessed, never the user's device zone.
version: "2026-10-16.2"
airports:            # IATA -> IANA
  LGW: Europe/London
  LHR: Europe/London
  TGD: Europe/Podgorica
  TIV: Europe/Podgorica
  DBV: Europe/Zagreb
  FCO: Europe/Rome
stations: {}
ports: {}
# Countries with exactly ONE zone (a proven mapping, not a guess): an address
# that names the country fixes the zone. Multi-zone countries never appear here.
countries:
  Montenegro: Europe/Podgorica
  Croatia: Europe/Zagreb
  United Kingdom: Europe/London
cities:            # a city -> its zone and airports (statement matching, an airport's locality)
  Podgorica: {tz: Europe/Podgorica, airports: [TGD]}
  London: {tz: Europe/London, airports: [LGW, LHR]}
  Kotor: {tz: Europe/Podgorica, airports: []}
  Dubrovnik: {tz: Europe/Zagreb, airports: [DBV]}
