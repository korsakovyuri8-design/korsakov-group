# API stays on FastAPI :8091. Everything else is the new TanStack frontend :8092.
# /demo itself is a frontend route; only the exact/prefix API paths below go to Python.
# Include this file in the http context. Global bucket holds no visitor identity.
limit_req_zone $server_name zone=atlas_revenue:1m rate=60r/m;
server {
    listen 80;
    listen [::]:80;
    server_name atlas.korsakovgroup.com;

    client_max_body_size 200k;

    location = /revenue/click {
        client_max_body_size 2k;
        client_body_timeout 5s;
        limit_req zone=atlas_revenue burst=10 nodelay;
        limit_req_status 429;
        # No request URL/query, IP, UA or referrer in telemetry access logs.
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8091;
        # Do not also include proxy_params here: duplicate Host/forwarded
        # headers can change origin validation or reintroduce private headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_set_header User-Agent "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/sample {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/import {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location ^~ /demo/trip/ {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/reset {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
