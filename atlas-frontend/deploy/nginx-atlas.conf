# API stays on FastAPI :8091. Everything else is the new TanStack frontend :8092.
# /demo itself is a frontend route; only the exact/prefix API paths below go to Python.
server {
    listen 80;
    listen [::]:80;
    server_name atlas.korsakovgroup.com;

    client_max_body_size 200k;

    location = /health {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/sample {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/import {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location ^~ /demo/trip/ {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }
    location = /demo/reset {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
